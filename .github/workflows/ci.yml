name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same pinned image as docker-compose.yml. If these drift, CI stops testing
        # what developers run.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.12"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Migrate
        run: make migrate

      # Deselects the handful of tests that download real model weights. Everything
      # about retrieval behaviour is covered by a deterministic fake encoder, so the
      # gate stays fast and needs no network. Phase 7's eval job caches the weights and
      # runs the full set.
      - name: Test
        run: make test-nomodel
